<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Konsult</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="spotlight-container" role="application" aria-label="Konsult Launcher">
    <!-- Header / Search input bar -->
    <header class="search-header">
      <div class="search-icon-wrapper" aria-hidden="true">
        <svg class="search-icon" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </div>
      <input
        type="text"
        id="search-input"
        class="search-input"
        placeholder="Type a query, tab title, or '@' for actions..."
        autocomplete="off"
        autocorrect="off"
        autocapitalize="off"
        spellcheck="false"
        role="combobox"
        aria-autocomplete="list"
        aria-expanded="false"
        aria-controls="results-list"
        aria-activedescendant=""
      />
      <div class="input-badges" id="input-badges">
        <span class="mode-badge" id="mode-badge" style="display: none;"></span>
      </div>
      <button id="clear-btn" class="clear-btn" aria-label="Clear input" style="display: none;" tabindex="-1">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </button>
    </header>

    <!-- Results list container -->
    <main class="results-container" id="results-container">
      <ul
        id="results-list"
        class="results-list"
        role="listbox"
        aria-label="Search results"
      >
        <!-- Dynamic result items rendered here -->
      </ul>
      <div id="empty-state" class="empty-state" style="display: none;">
        <span class="empty-icon">🔍</span>
        <p class="empty-text">No matching tabs or commands found</p>
      </div>
    </main>

    <!-- Footer with keyboard shortcuts helper -->
    <footer class="spotlight-footer">
      <div class="footer-hints">
        <span class="hint-item"><kbd>↑</kbd><kbd>↓</kbd> navigate</span>
        <span class="hint-item"><kbd>↵</kbd> select</span>
        <span class="hint-item"><kbd>⇧</kbd><kbd>↵</kbd> web search</span>
        <span class="hint-item"><kbd>esc</kbd> close</span>
      </div>
      <div class="footer-meta">
        <button id="options-btn" class="footer-btn" title="Open Settings" aria-label="Open Settings" tabindex="-1">
          <svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="3"></circle>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
          </svg>
        </button>
      </div>
    </footer>
  </div>

  <script type="module" src="popup.js"></script>
</body>
</html>
